name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect project type
        id: detect
        run: |
          if [ -f pubspec.yaml ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          else
            echo "type=android" >> $GITHUB_OUTPUT
          fi

      - name: Set up Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Write google-services.json (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GS" > android/app/google-services.json

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Write google-services.json (Native)
        if: steps.detect.outputs.type == 'android'
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GS" > app/google-services.json

      - name: Build Native APK
        if: steps.detect.outputs.type == 'android'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK (Native)
        if: steps.detect.outputs.type == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
