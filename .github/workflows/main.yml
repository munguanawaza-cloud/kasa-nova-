name: Build KASA NOVA APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify Android project structure & Firebase config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        echo "Checking required Android files..."
        test -f settings.gradle.kts
        test -f build.gradle.kts
        test -f app/build.gradle.kts
        test -f gradle/libs.versions.toml
        if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
        fi
        if [ -f app/google-services.json ]; then
          echo "Found app/google-services.json"
        else
          echo "::warning::app/google-services.json is missing; APK will build, but Google Sign-In requires uploading app/google-services.json or setting the GOOGLE_SERVICES_JSON secret."
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools build-tools;36.0.0 platforms;android-36'

    - name: Restore fixed debug keystore and print SHA-1 / SHA-256
      run: |
        mkdir -p ~/.android
        if [ -f debug.keystore.base64 ]; then
          echo "Restoring fixed debug keystore from debug.keystore.base64..."
          base64 -d debug.keystore.base64 > ~/.android/debug.keystore
        else
          echo "debug.keystore.base64 not found; generating a new debug keystore..."
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

        echo "=== DEBUG KEYSTORE FINGERPRINTS ==="
        keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | tee /tmp/keystore_info.txt
        SHA1=$(grep -m1 "SHA1:" /tmp/keystore_info.txt | sed 's/.*SHA1:[[:space:]]*//')
        SHA256=$(grep -m1 "SHA256:" /tmp/keystore_info.txt | sed 's/.*SHA256:[[:space:]]*//')
        echo "STATIC_DEBUG_SHA1=$SHA1"
        echo "STATIC_DEBUG_SHA256=$SHA256"

        {
          echo "### KASA NOVA Debug Keystore Fingerprints"
          echo "- **SHA-1**: \`$SHA1\`"
          echo "- **SHA-256**: \`$SHA256\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Configure optional Maps secret
      env:
        MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      run: |
        if [ -n "$MAPS_KEY" ]; then
          echo "GOOGLE_MAPS_API_KEY=$MAPS_KEY" > .env
        fi

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KASA-NOVA-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14
